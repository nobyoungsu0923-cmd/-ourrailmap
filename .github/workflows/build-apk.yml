name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Make Android project
        run: |
          mkdir -p apk && cd apk
          mkdir -p app/src/main/assets app/src/main/java/com/couple/ourmap app/src/main/res/drawable
          cp ../index.html app/src/main/assets/index.html
          cat > settings.gradle <<'X'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OurRailMap"
          include ':app'
          X
          cat > build.gradle <<'X'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          X
          cat > gradle.properties <<'X'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          X
          cat > app/build.gradle <<'X'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.couple.ourmap'
              compileSdk 34
              defaultConfig {
                  applicationId "com.couple.ourmap"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          X
          cat > app/src/main/res/drawable/ic_launcher.xml <<'X'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF5C8A" android:pathData="M24,4h60a20,20 0,0 1,20 20v60a20,20 0,0 1,-20 20h-60a20,20 0,0 1,-20 -20v-60a20,20 0,0 1,20 -20z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="5" android:fillColor="#00000000"
                  android:pathData="M22,80 L42,54 L62,64 L86,30"/>
              <path android:fillColor="#FFFFFF" android:pathData="M42,54m-7,0a7,7 0,1 0,14 0a7,7 0,1 0,-14 0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M86,30m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M62,74C56,69 50,65 50,59.5C50,56 52.6,53.5 55.8,53.5C58.3,53.5 60.6,55 62,57.2C63.4,55 65.7,53.5 68.2,53.5C71.4,53.5 74,56 74,59.5C74,65 68,69 62,74z"/>
          </vector>
          X
          cat > app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:label="우리의 노선도"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          X
          cat > app/src/main/java/com/couple/ourmap/MainActivity.java <<'X'
          package com.couple.ourmap;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int REQ_PICK = 1001, REQ_SAVE = 1002;
              private WebView web;
              private ValueCallback<Uri[]> cb;
              private StringBuilder pending;
              private String pendingName, pendingMime;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xFFFFF7F9);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  web.addJavascriptInterface(new Bridge(), "OurMapAndroid");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> c, FileChooserParams p) {
                          if (cb != null) cb.onReceiveValue(null);
                          cb = c;
                          boolean image = false;
                          for (String t : p.getAcceptTypes()) if (t != null && t.startsWith("image/")) image = true;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(image ? "image/*" : "*/*");
                          if (p.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(i, image ? "사진 고르기" : "파일 고르기"), REQ_PICK);
                          } catch (Exception e) {
                              cb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              class Bridge {
                  @JavascriptInterface
                  public void beginFile(String name, String mime) {
                      pending = new StringBuilder();
                      pendingName = name;
                      pendingMime = mime;
                  }

                  @JavascriptInterface
                  public void appendText(String chunk) {
                      if (pending != null) pending.append(chunk);
                  }

                  @JavascriptInterface
                  public void finishFile() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType(pendingMime);
                              i.putExtra(Intent.EXTRA_TITLE, pendingName);
                              try {
                                  startActivityForResult(i, REQ_SAVE);
                              } catch (Exception e) {
                                  saved(false);
                              }
                          }
                      });
                  }
              }

              private void saved(boolean ok) {
                  pending = null;
                  web.evaluateJavascript("window.__onSaved&&window.__onSaved(" + ok + ")", null);
              }

              @Override
              protected void onActivityResult(int code, int res, Intent d) {
                  super.onActivityResult(code, res, d);
                  if (code == REQ_PICK && cb != null) {
                      Uri[] r = null;
                      if (res == RESULT_OK && d != null) {
                          ClipData clip = d.getClipData();
                          if (clip != null && clip.getItemCount() > 0) {
                              r = new Uri[clip.getItemCount()];
                              for (int k = 0; k < r.length; k++) r[k] = clip.getItemAt(k).getUri();
                          } else if (d.getData() != null) {
                              r = new Uri[]{d.getData()};
                          }
                      }
                      cb.onReceiveValue(r);
                      cb = null;
                  } else if (code == REQ_SAVE) {
                      if (res == RESULT_OK && d != null && d.getData() != null && pending != null) {
                          try {
                              OutputStream os = getContentResolver().openOutputStream(d.getData());
                              os.write(pending.toString().getBytes(StandardCharsets.UTF_8));
                              os.close();
                              saved(true);
                          } catch (Exception e) {
                              saved(false);
                          }
                      } else {
                          saved(false);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("window.__onBack?window.__onBack():false", new ValueCallback<String>() {
                      public void onReceiveValue(String v) {
                          if (!"true".equals(v)) moveTaskToBack(true);
                      }
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          X
      - name: Build debug APK
        working-directory: apk
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: our-railmap-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk

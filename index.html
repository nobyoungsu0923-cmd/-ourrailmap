<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#D9466A">
<title>우리의 노선도</title>
<style>
:root{
  --bg:#FFF7F9; --sea:#E4EEF6; --land:#FFFDF9; --land-edge:#E7DCD3; --north:#F2EEEA;
  --ink:#2B2730; --ink2:#6B6470; --ink3:#A39AA6; --line:#EDE4E8; --card:#FFFFFF;
  --pink:#D9466A; --pink2:#FBE6EB; --pink-ink:#B2304F; --star:#E0A100;
  --river:#CFE0EE; --sea-ink:#8FAAC2; --lm-heri:#B0553F; --lm-nature:#3C8659; --lm-water:#2E77A8; --lm-modern:#5A5E7C;
  --shadow:0 6px 24px rgba(80,30,50,.14); --halo:#FFFDF9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1720; --sea:#141821; --land:#24212B; --land-edge:#3A3542; --north:#1E1B24;
    --ink:#F3EEF4; --ink2:#C1B8C4; --ink3:#857C89; --line:#36303B; --card:#2A2630;
    --pink:#FF7F9C; --pink2:#43242F; --pink-ink:#FFB3C4; --star:#FFCC33;
    --river:#1C2532; --sea-ink:#4F6378; --lm-heri:#E3977E; --lm-nature:#7CC49A; --lm-water:#7AB4DE; --lm-modern:#AEB2D2;
    --shadow:0 6px 24px rgba(0,0,0,.45); --halo:#24212B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1720; --sea:#141821; --land:#24212B; --land-edge:#3A3542; --north:#1E1B24;
  --ink:#F3EEF4; --ink2:#C1B8C4; --ink3:#857C89; --line:#36303B; --card:#2A2630;
  --pink:#FF7F9C; --pink2:#43242F; --pink-ink:#FFB3C4; --star:#FFCC33;
    --river:#1C2532; --sea-ink:#4F6378; --lm-heri:#E3977E; --lm-nature:#7CC49A; --lm-water:#7AB4DE; --lm-modern:#AEB2D2;
  --shadow:0 6px 24px rgba(0,0,0,.45); --halo:#24212B; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--sea)}

/* 상단 */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;z-index:10}
#topRow{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;pointer-events:auto}
#brand{display:flex;flex-direction:column;justify-content:center;background:var(--card);border-radius:16px;padding:6px 12px;box-shadow:var(--shadow);min-height:46px;cursor:pointer;border:0;text-align:left}
#brand b{font-size:14px;font-weight:800;color:var(--pink);white-space:nowrap;display:flex;align-items:center;gap:6px}
#brand .logo{width:20px;height:12px}
.fab svg{width:22px;height:22px}
#brand small{font-size:11px;color:var(--ink2);white-space:nowrap}
#searchBox{flex:1;position:relative;min-width:0}
#q{width:100%;height:46px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);padding:0 40px 0 40px;font-size:15px;outline:none}
#q::placeholder{color:var(--ink3)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#searchBox .ico{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--ink3);pointer-events:none}
#qClear{position:absolute;right:6px;top:7px;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--ink3);font-size:18px}
#results{position:absolute;left:0;right:0;top:52px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);max-height:min(60vh,420px);overflow:auto;padding:6px}
.res{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px;border-radius:12px;text-align:left}
.res:hover,.res.on{background:var(--pink2)}
.res .nm{font-weight:700;font-size:15px}
.res .sb{font-size:12px;color:var(--ink2)}
.res .badges{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.res .heart{color:var(--pink)}
.empty{padding:16px;text-align:center;color:var(--ink2);font-size:14px}
#chips{display:flex;gap:6px;max-width:640px;margin:8px auto 0;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--card);box-shadow:0 2px 10px rgba(80,30,50,.10);font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px}
.chip.on{background:var(--pink);color:#fff}
.chip.tog{background:var(--card)}
.chip.tog.off{opacity:.5;text-decoration:line-through}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
#focusBar{max-width:640px;margin:8px auto 0;pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
#focusBar .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#focusBar .bar i{display:block;height:100%;background:var(--pink);border-radius:3px}
#focusBar button{border:0;background:transparent;font-size:16px;color:var(--ink2);width:28px;height:28px}

/* 노선 배지 */
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;color:#fff;font-size:11px;font-weight:800;line-height:1;white-space:nowrap;border:0}
.lb.big{height:26px;min-width:26px;border-radius:13px;font-size:12px;padding:0 9px}

/* 오른쪽 아래 버튼 */
#fabs{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px;z-index:9}
.fab{width:52px;height:52px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:20px;color:var(--ink)}
.fab small{font-size:9.5px;font-weight:700;color:var(--ink2)}
.fab.main{background:var(--pink);color:#fff}
.fab.main small{color:#fff}
#zoomBtns{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);z-index:9}
#zoomBtns button{width:42px;height:42px;border:0;background:var(--card);font-size:20px;color:var(--ink2)}
#zoomBtns button+button{border-top:1px solid var(--line)}

/* 시트/모달 */
#scrim{position:fixed;inset:0;background:rgba(20,10,20,.32);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(60,20,40,.18);z-index:21;
  max-height:72vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet.full{max-height:none;top:0;border-radius:0;padding-top:env(safe-area-inset-top)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheetHead{padding:10px 18px 12px;flex:none;display:flex;align-items:flex-start;gap:10px}
.sheetHead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sheetHead .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.sheetHead .x{margin-left:auto;width:36px;height:36px;border-radius:12px;border:0;background:var(--card);font-size:18px;color:var(--ink2);flex:none}
.sheetBody{overflow:auto;padding:0 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.badgeRow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.actRow{display:flex;gap:8px;margin:4px 0 14px}
.btn{height:46px;border-radius:14px;border:0;padding:0 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pink);color:#fff;flex:1}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line) inset,0 0 0 1px var(--line) inset}
.btn.sec.on{color:var(--star)}
.btn.danger{background:transparent;color:#D6455D}
.btn.sm{height:36px;font-size:13px;padding:0 12px;border-radius:11px}
.rec{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.rec .d{font-size:12.5px;color:var(--pink-ink);font-weight:700}
.rec .t{font-size:16px;font-weight:800;margin:3px 0 0}
.rec .m{font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:6px;color:var(--ink)}
.rec .ops{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
.rec .ops button{border:0;background:transparent;color:var(--ink3);font-size:13px;padding:6px 8px;border-radius:8px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;border-radius:12px;overflow:hidden}
.ph.n1{grid-template-columns:1fr}
.ph.n2{grid-template-columns:1fr 1fr}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line);cursor:zoom-in}
.ph.n1 img{aspect-ratio:4/3}
.emptyRec{text-align:center;padding:26px 10px;color:var(--ink2);font-size:14px;line-height:1.7}
.emptyRec .stamp{width:54px;height:54px;margin:0 auto 10px;display:block;color:var(--pink);opacity:.8}
.vtag{display:inline-block;font-size:10.5px;font-weight:800;color:var(--pink-ink);background:var(--pink2);border-radius:6px;padding:2px 5px;margin-left:6px;vertical-align:2px}

/* 편집기 */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;border:0;border-radius:14px;background:var(--card);padding:12px 14px;font-size:15px;outline:none;box-shadow:0 0 0 1px var(--line) inset}
.inp:focus{box-shadow:0 0 0 2px var(--pink) inset}
textarea.inp{min-height:120px;resize:vertical;line-height:1.6}
.phEdit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phEdit .cell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.phEdit .cell img{width:100%;height:100%;object-fit:cover;display:block}
.phEdit .cell button{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1}
.phEdit .add{aspect-ratio:1;border-radius:12px;border:2px dashed var(--pink);background:var(--pink2);color:var(--pink-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.phEdit .add small{font-size:11px}
.busy{font-size:12px;color:var(--ink2);margin-top:6px}

/* 앨범/통계 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--pink)}
.stat span{font-size:12px;color:var(--ink2)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;height:38px;border-radius:12px;border:0;background:var(--card);font-weight:700;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.month{font-size:13px;font-weight:800;color:var(--ink2);margin:16px 2px 8px}
.alb{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;border:0;width:100%;text-align:left}
.alb .th{width:62px;height:62px;border-radius:12px;background:var(--pink2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.alb .th img{width:100%;height:100%;object-fit:cover}
.alb .tx{min-width:0;flex:1}
.alb .tx b{display:block;font-size:15px}
.alb .tx span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;border:0;width:100%;text-align:left}
.prog .nm{font-size:14px;font-weight:700;min-width:0;flex:1}
.prog .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.prog .bar i{display:block;height:100%;border-radius:3px}
.prog .num{font-size:12px;color:var(--ink2);white-space:nowrap}

/* 사진 보기 */
#viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:22px;font-size:20px}
#vClose{top:calc(env(safe-area-inset-top) + 12px);right:12px}
#vPrev{left:10px;top:50%;margin-top:-22px}
#vNext{right:10px;top:50%;margin-top:-22px}
#vCount{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;color:#fff;font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:900px){
  .sheet:not(.full){left:auto;right:16px;bottom:16px;top:auto;width:400px;border-radius:24px;max-height:calc(100vh - 32px)}
  .sheet:not(.full).on{transform:none}
  .sheet:not(.full){transform:translateX(120%)}
  .sheet.full{max-width:720px;top:16px;bottom:16px;border-radius:24px}
}
</style>
</head>
<body>
<canvas id="map" aria-label="전국 철도 노선도"></canvas>

<div id="top">
  <div id="topRow">
    <button id="brand" title="우리 설정"><b><svg class="logo" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 9 L8 3 L12 7 L18 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="9" r="2" fill="currentColor"/><circle cx="18" cy="2" r="2" fill="currentColor"/></svg>우리의 노선도</b><small id="dday">눌러서 우리 정보 넣기</small></button>
    <div id="searchBox">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="역·노선·명소 검색 (초성 OK)" autocomplete="off" enterkeyhint="search">
      <button id="qClear" class="hidden" aria-label="지우기">✕</button>
      <div id="results" class="hidden"></div>
    </div>
  </div>
  <div id="chips"></div>
  <div id="focusBar" class="hidden"></div>
</div>

<div id="zoomBtns"><button id="zIn" aria-label="확대">＋</button><button id="zOut" aria-label="축소">－</button></div>
<div id="fabs">
  <button class="fab" id="fabRandom" title="데이트 역 뽑기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg><small>뽑기</small></button>
  <button class="fab main" id="fabAlbum" title="추억 모아보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M3 17l5-4 4 3 3-2 6 4"/><path d="M7 5l1.5-2h7L17 5"/></svg><small id="fabCount">추억</small></button>
</div>

<div id="scrim"></div>

<!-- 역 시트 -->
<section class="sheet" id="stSheet" aria-label="역 정보">
  <div class="grab"></div>
  <div class="sheetHead">
    <div style="min-width:0">
      <h2 id="stName"></h2>
      <div class="sub" id="stSub"></div>
      <div class="badgeRow" id="stBadges"></div>
    </div>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheetBody">
    <div class="actRow">
      <button class="btn pri" id="addRec">＋ 추억 남기기</button>
      <button class="btn sec" id="wishBtn">☆ 가고 싶어</button>
    </div>
    <div id="recList"></div>
  </div>
</section>

<!-- 랜드마크 -->
<section class="sheet" id="lmSheet" aria-label="명소 정보">
  <div class="grab"></div>
  <div class="sheetHead">
    <canvas id="lmIcon" width="96" height="96" style="width:48px;height:48px;flex:none"></canvas>
    <div style="min-width:0">
      <h2 id="lmName"></h2>
      <div class="sub" id="lmDesc"></div>
    </div>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheetBody">
    <div class="month" style="margin-top:0">가까운 역</div>
    <div id="lmNear"></div>
  </div>
</section>

<!-- 기록 편집 -->
<section class="sheet full" id="edSheet" aria-label="추억 기록">
  <div class="sheetHead">
    <div><h2 id="edTitle">추억 남기기</h2><div class="sub" id="edSub"></div></div>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheetBody">
    <div class="field"><label for="edDate">날짜</label><input class="inp" type="date" id="edDate"></div>
    <div class="field"><label for="edHead">제목 (선택)</label><input class="inp" id="edHead" maxlength="60" placeholder="예) 첫 데이트, 비 오는 날 산책"></div>
    <div class="field"><label>사진</label>
      <div class="phEdit" id="edPhotos"></div>
      <input type="file" id="edFile" accept="image/*" multiple class="hidden">
      <div class="busy hidden" id="edBusy">사진 정리 중…</div>
    </div>
    <div class="field"><label for="edMemo">메모</label><textarea class="inp" id="edMemo" placeholder="오늘 뭐 했는지, 뭐 먹었는지, 무슨 얘기 했는지…"></textarea></div>
    <div class="actRow"><button class="btn pri" id="edSave">저장하기</button></div>
    <div style="text-align:center"><button class="btn danger sm hidden" id="edDel">이 추억 지우기</button></div>
  </div>
</section>

<!-- 앨범 -->
<section class="sheet full" id="albSheet" aria-label="추억 모아보기">
  <div class="sheetHead">
    <div><h2>우리의 추억</h2><div class="sub" id="albSub"></div></div>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheetBody">
    <div class="stats" id="albStats"></div>
    <div class="tabs" id="albTabs">
      <button data-t="time" class="on">타임라인</button><button data-t="lines">노선 정복</button><button data-t="wish">가고 싶은 역</button>
    </div>
    <div id="albBody"></div>
  </div>
</section>

<!-- 설정 -->
<section class="sheet full" id="setSheet" aria-label="설정">
  <div class="sheetHead">
    <div><h2>우리 설정</h2><div class="sub">이름이랑 처음 만난 날을 적어줘</div></div>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheetBody">
    <div class="field"><label for="setA">나</label><input class="inp" id="setA" maxlength="12" placeholder="이름 / 애칭"></div>

/* ───────── 저장소 (IndexedDB) ───────── */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open("ourmap", 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore("records", { keyPath: "id" });
        d.createObjectStore("photos", { keyPath: "id" });
        d.createObjectStore("meta", { keyPath: "k" });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), os = t.objectStore(store);
      let out; const r = fn(os);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    all: s => tx(s, "readonly", os => os.getAll()),
    get: (s, k) => tx(s, "readonly", os => os.get(k)),
    put: (s, v) => tx(s, "readwrite", os => os.put(v)),
    del: (s, k) => tx(s, "readwrite", os => os.delete(k)),
  };
})();

let RECS = [];             // 모든 기록

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const urlCache = new Map();
async function photoURL(id, kind = "thumb") {
  const key = id + ":" + kind;
  if (urlCache.has(key)) return urlCache.get(key);
  const p = await DB.get("photos", id);
  if (!p) return "";
  const u = URL.createObjectURL(p[kind] || p.full);
  urlCache.set(key, u); return u;
}

/* ───────── 캔버스 지도 ───────── */

    if (L.t > tier) continue;
    const x = sx(L.wx), y = sy(L.wy);
    if (x < -40 || y < -40 || x > W + 40 || y > H + 40) continue;
    drawLandmark(L, x, y, lms, focusLine ? 0.35 : 1);

      [v.x - w / 2, v.y - r - h, "left"], [v.x - w / 2, v.y + r, "left"],

}

const S_MIN = 0.35, S_MAX = 260;
function zoomAt(px, py, f) {

  draw();
}
let anim = null;
function flyTo(x, y, s, ms = 520, oy = 0) {
  const a = { x: cam.x, y: cam.y, s: cam.s }, b = { x, y: y + oy / s, s: clamp(s, S_MIN, S_MAX) };
  const t0 = performance.now();
  cancelAnimationFrame(anim);
  if (ms <= 0) { Object.assign(cam, b); draw(); return; }
  const step = (now) => {
    const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const ls = Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * e;
    cam.s = Math.exp(ls); cam.x = a.x + (b.x - a.x) * e; cam.y = a.y + (b.y - a.y) * e;
    render();

  };
  anim = requestAnimationFrame(step);
}
function fitBox(x0, y0, x1, y1, ms) {
  const top = 130, bottom = 30, side = 24;
  const s = Math.min((W - side * 2) / Math.max(x1 - x0, 0.01), (H - top - bottom) / Math.max(y1 - y0, 0.01));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - ((top - bottom) / 2) / s;

}
function fitStations(list, ms, trim = 0) {
  const xs = list.map(t => t.wx).sort((a, b) => a - b), ys = list.map(t => t.wy).sort((a, b) => a - b);
  const k = Math.floor(list.length * trim), e = list.length - 1 - k;
  fitBox(xs[k], ys[k], xs[e], ys[e], ms);
}
function focusStation(i, ms) {
  const t = ST[i];

  const sheetH = innerWidth >= 900 ? 0 : Math.min(H * 0.72, 520);
  const offset = innerWidth >= 900 ? 0 : (sheetH / 2 - 40);
  const ox = innerWidth >= 900 ? 200 / s : 0;
  flyTo(t.wx + ox, t.wy, s, ms, offset);
}

/* 입력: 드래그·핀치·휠·탭 */
const ptrs = new Map();
let gest = null, moved = false, downT = 0, downXY = null, lastTap = 0;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cancelAnimationFrame(anim);
  if (ptrs.size === 1) { moved = false; downT = performance.now(); downXY = { x: e.clientX, y: e.clientY }; }
  gest = null;
  hideResults();
});
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), nx = e.clientX, ny = e.clientY;
  if (ptrs.size === 1) {
    if (Math.hypot(nx - downXY.x, ny - downXY.y) > 6) moved = true;
    if (moved) { cam.x -= (nx - p.x) / cam.s; cam.y -= (ny - p.y) / cam.s; draw(); }
    p.x = nx; p.y = ny;
  } else if (ptrs.size === 2) {
    moved = true;
    const [a, b] = [...ptrs.values()];
    const before = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    p.x = nx; p.y = ny;
    const [c, d] = [...ptrs.values()];
    const after = { d: Math.hypot(c.x - d.x, c.y - d.y), mx: (c.x + d.x) / 2, my: (c.y + d.y) / 2 };
    cam.x -= (after.mx - before.mx) / cam.s; cam.y -= (after.my - before.my) / cam.s;
    if (before.d > 0) zoomAt(after.mx, after.my, after.d / before.d);
    draw();
  }
});
function endPtr(e) {

  if (ptrs.size === 0 && !moved && performance.now() - downT < 450) {
    const now = performance.now();
    const hitI = pick(e.clientX, e.clientY);
    const lm = hitI == null ? pickLandmark(e.clientX, e.clientY) : null;
    if (hitI != null) openStation(hitI);
    else if (lm) openLandmark(lm);
    else if (now - lastTap < 300) zoomAt(e.clientX, e.clientY, 2);

}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", e => ptrs.delete(e.pointerId));
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))); }, { passive: false });
function pick(px, py) {
  let best = null, bd = 24;

    const d = Math.hypot(sx(t.wx) - px, sy(t.wy) - py);

}

}

const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = str => [...str].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const clean = s => s.replace(/[\s·.()\-]/g, "").toLowerCase();
ST.forEach(t => { t.key = clean(t.n); t.cho = chosung(t.key); });

  return `<span class="lb${big ? " big" : ""}" style="background:${l.color}" title="${l.name}">${l.short}</span>`;
}
function search(q) {
  q = clean(q); if (!q) return [];
  const qq = q.replace(/역$/, "") || q;
  const out = [];
  const cho = isCho(qq);
  for (const t of ST) {
    let sc = -1;
    if (cho) { const k = t.cho.indexOf(qq); if (k >= 0) sc = (k === 0 ? 50 : 20) - t.cho.length * 0.1; }
    else { const k = t.key.indexOf(qq); if (k >= 0) sc = (t.key === qq ? 100 : k === 0 ? 60 : 30) - t.key.length * 0.1; }
    if (sc >= 0) out.push({ type: "st", t, sc: sc + t.l.length * 0.5 + (visited(t) ? 3 : 0) });
  }
  for (const L of LANDMARKS) {
    const k = clean(L.n), hitM = cho ? chosung(k).includes(qq) : k.includes(qq);
    if (hitM) out.push({ type: "lm", L, sc: k.startsWith(qq) || chosung(k).startsWith(qq) ? 58 : 35 });
    else if (!cho && qq.length >= 2 && clean(L.d).includes(qq)) out.push({ type: "lm", L, sc: 25 });
  }
  for (const l of LN) {
    const hitL = cho ? l.cho.includes(qq) : l.key.includes(qq);
    if (hitL) out.push({ type: "ln", l, sc: 40 });

}

  </article>`).join("");
  list.querySelectorAll("img[data-p]").forEach(async img => {
    img.src = await photoURL(img.dataset.p, img.closest(".ph").classList.contains("n1") ? "full" : "thumb");
    img.onclick = () => { const r = RECS.find(x => x.id === img.closest(".rec").dataset.id); openViewer(r.photos, +img.dataset.k); };
  });
  list.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => openEditor(RECS.find(x => x.id === b.dataset.ed)));
}
function dday(date) {
  if (!SETTINGS.day || !date) return "";
  const a = new Date(SETTINGS.day + "T00:00:00"), b = new Date(date + "T00:00:00");
  const n = Math.round((b - a) / 864e5) + 1;
  return n >= 1 ? `D+${n}` : "";
}

/* ───────── 기록 편집 ───────── */
let edRec = null, edPhotos = [];   // edPhotos: [{id, url, isNew, full, thumb}]
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
async function openEditor(rec) {
  edRec = rec || null;
  $("#edTitle").textContent = rec ? "추억 고치기" : "추억 남기기";
  $("#edSub").textContent = disp(curSt) + " · " + subOf(curSt);
  $("#edDate").value = rec ? rec.date : today();
  $("#edHead").value = rec ? rec.title || "" : "";
  $("#edMemo").value = rec ? rec.memo || "" : "";
  $("#edDel").classList.toggle("hidden", !rec);
  edPhotos = [];
  if (rec) for (const id of rec.photos) edPhotos.push({ id, url: await photoURL(id) });
  renderEdPhotos();
  openSheet($("#edSheet"));
  $("#edSheet .sheetBody").scrollTop = 0;
}
function renderEdPhotos() {
  const g = $("#edPhotos");
  g.innerHTML = edPhotos.map((p, k) => `<div class="cell"><img src="${p.url}" alt=""><button data-rm="${k}" aria-label="사진 빼기">✕</button></div>`).join("") +
    `<button class="add" id="edAdd">＋<small>사진 추가</small></button>`;
  g.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { edPhotos.splice(+b.dataset.rm, 1); renderEdPhotos(); });
  $("#edAdd").onclick = () => $("#edFile").click();
}
$("#addRec").onclick = () => openEditor(null);
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => res({ im, u }); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("이미지를 못 읽었어")); };
    im.src = u;
  });
}
function shrink(im, max, q) {
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", q));
}
$("#edFile").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  $("#edBusy").classList.remove("hidden");
  for (const f of files) {
    try {
      const { im, u } = await loadImg(f);
      const full = await shrink(im, 1600, 0.85), thumb = await shrink(im, 420, 0.8);
      URL.revokeObjectURL(u);
      edPhotos.push({ id: uid(), url: URL.createObjectURL(thumb), isNew: true, full, thumb });
      renderEdPhotos();
    } catch (err) { toast("사진 하나를 못 읽었어"); }
  }
  $("#edBusy").classList.add("hidden");
});
$("#edSave").onclick = async () => {
  const memo = $("#edMemo").value.trim(), title = $("#edHead").value.trim();
  if (!memo && !title && !edPhotos.length) { toast("사진이나 메모를 하나는 남겨줘!"); return; }
  const btn = $("#edSave"); btn.disabled = true;
  try {
    for (const p of edPhotos) if (p.isNew) { await DB.put("photos", { id: p.id, full: p.full, thumb: p.thumb }); urlCache.set(p.id + ":thumb", p.url); p.isNew = false; }
    const old = edRec ? edRec.photos : [];
    const keep = new Set(edPhotos.map(p => p.id));
    for (const id of old) if (!keep.has(id)) await DB.del("photos", id);
    const rec = edRec ? Object.assign(edRec, { date: $("#edDate").value || today(), title, memo, photos: edPhotos.map(p => p.id), updated: Date.now() })
      : { id: uid(), station: curSt.id, date: $("#edDate").value || today(), title, memo, photos: edPhotos.map(p => p.id), created: Date.now(), updated: Date.now() };
    await DB.put("records", rec);
    if (!edRec) RECS.push(rec);
    const first = (REC_MAP.get(curSt.id) || []).length === 0;
    reindex();
    closeSheet($("#edSheet"));
    openStation(curSt.i);
    toast(first ? `${disp(curSt)}에 첫 도장 쾅!` : "저장했어");
  } catch (err) { toast("저장 실패: " + err.message); }
  btn.disabled = false;
};
let delArm = 0;
$("#edDel").onclick = async () => {
  if (!edRec) return;
  const btn = $("#edDel");
  if (Date.now() - delArm > 4000) { delArm = Date.now(); btn.textContent = "정말 지울까? 한 번 더 누르면 사진까지 지워져"; setTimeout(() => { btn.textContent = "이 추억 지우기"; }, 4000); return; }
  delArm = 0; btn.textContent = "이 추억 지우기";
  for (const id of edRec.photos) await DB.del("photos", id);
  await DB.del("records", edRec.id);
  RECS = RECS.filter(r => r !== edRec);
  reindex(); closeSheet($("#edSheet")); openStation(curSt.i); toast("지웠어");
};

/* ───────── 사진 뷰어 ───────── */
let vList = [], vK = 0;
async function openViewer(list, k) { vList = list; vK = k; $("#viewer").classList.remove("hidden"); showV(); }
async function showV() {
  $("#vImg").src = await photoURL(vList[vK], "full");
  $("#vCount").textContent = vList.length > 1 ? `${vK + 1} / ${vList.length}` : "";
  $("#vPrev").classList.toggle("hidden", vList.length < 2); $("#vNext").classList.toggle("hidden", vList.length < 2);
}
function closeViewer() { $("#viewer").classList.add("hidden"); $("#vImg").removeAttribute("src"); }
$("#vClose").onclick = closeViewer;
$("#vPrev").onclick = e => { e.stopPropagation(); vK = (vK - 1 + vList.length) % vList.length; showV(); };
$("#vNext").onclick = e => { e.stopPropagation(); vK = (vK + 1) % vList.length; showV(); };
$("#vImg").onclick = closeViewer;
{ let x0 = null; $("#viewer").addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  $("#viewer").addEventListener("touchend", e => { if (x0 == null || vList.length < 2) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) { vK = (vK + (dx < 0 ? 1 : -1) + vList.length) % vList.length; showV(); } x0 = null; }); }

/* ───────── 앨범 / 통계 ───────── */
let albTab = "time";
function updateCounts() {
  const n = REC_MAP.size;
  $("#fabCount").textContent = n ? `${n}역` : "추억";
}
$("#fabAlbum").onclick = () => { renderAlbum(); openSheet($("#albSheet")); };
$("#albTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; albTab = b.dataset.t; renderAlbum(); });
function renderAlbum() {
  const names = [SETTINGS.a, SETTINGS.b].filter(Boolean);
  $("#albSub").textContent = names.length === 2 ? `${names[0]} & ${names[1]}` : "함께 다닌 역들";
  const photos = RECS.reduce((a, r) => a + r.photos.length, 0);
  $("#albStats").innerHTML = `<div class="stat"><b>${REC_MAP.size}</b><span>함께 간 역</span></div><div class="stat"><b>${RECS.length}</b><span>추억</span></div><div class="stat"><b>${photos}</b><span>사진</span></div>`;
  document.querySelectorAll("#albTabs button").forEach(b => b.classList.toggle("on", b.dataset.t === albTab));
  const body = $("#albBody");
  if (albTab === "time") {
    if (!RECS.length) { body.innerHTML = `<div class="emptyRec">${STAMP}아직 기록이 없어.<br>지도에서 역을 눌러 첫 추억을 남겨봐.</div>`; return; }
    const recs = sortRecs([...RECS]);
    let html = "", lastM = "";
    for (const r of recs) {
      const m = (r.date || "").slice(0, 7);
      if (m !== lastM) { const [y, mm] = m.split("-"); html += `<div class="month">${y}년 ${+mm}월</div>`; lastM = m; }
      const t = ST[ST_BY_ID[r.station]];
      html += `<button class="alb" data-st="${t ? t.i : ""}"><div class="th">${r.photos[0] ? `<img data-p="${r.photos[0]}" alt="">` : "🚉"}</div><div class="tx"><b>${esc(t ? disp(t) : r.station)}${r.title ? ` · ${esc(r.title)}` : ""}</b><span>${esc(fmtDate(r.date))}${dday(r.date) ? " · " + dday(r.date) : ""}</span><span>${esc((r.memo || "").split("\n")[0])}</span></div></button>`;
    }
    body.innerHTML = html;
    body.querySelectorAll("img[data-p]").forEach(async im => im.src = await photoURL(im.dataset.p));
  } else if (albTab === "lines") {
    const rows = LN.map(l => { const sts = lineStations(l); return { l, n: sts.length, v: sts.filter(visited).length }; })
      .sort((a, b) => (b.v / b.n) - (a.v / a.n) || b.v - a.v || (a.l.kind === "metro" ? -1 : 1));
    body.innerHTML = rows.map(r => `<button class="prog" data-l="${r.l.id}">${badge(r.l)}<div class="nm">${esc(r.l.name)}<div class="bar"><i style="width:${(r.v / r.n * 100).toFixed(1)}%;background:${r.l.color}"></i></div></div><span class="num">${r.v}/${r.n}${r.v === r.n ? " 완주" : ""}</span></button>`).join("");
  } else {
    const w = [...WISH].map(id => ST[ST_BY_ID[id]]).filter(Boolean);
    body.innerHTML = w.length ? w.map(t => `<button class="alb" data-st="${t.i}"><div class="th">⭐</div><div class="tx"><b>${esc(disp(t))}</b><span>${t.lines.map(l => esc(l.name)).join(" · ")}</span><span>${visited(t) ? "가 봤어" : "아직 안 가 봤어"}</span></div></button>`).join("")
      : `<div class="emptyRec">${STAMP}역을 누르고 '가고 싶어'를 눌러두면<br>여기 모아서 보여줄게.</div>`;
  }
  body.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { if (b.dataset.st === "") return; closeAll(); openStation(+b.dataset.st, true); });
  body.querySelectorAll(".prog[data-l]").forEach(b => b.onclick = () => setFocusLine(b.dataset.l, true));
}

/* ───────── 랜덤 데이트 역 ───────── */
$("#fabRandom").onclick = () => {
  const onScreen = ST.filter(t => t.lines.some(lineVisible) && !visited(t) && (!focusLine || t.l.includes(focusLine))).filter(t => { const x = sx(t.wx), y = sy(t.wy); return x > 0 && y > 120 && x < W && y < H; });
  const pool = onScreen.length ? onScreen : ST.filter(t => !visited(t));
  if (!pool.length) { toast("모든 역을 다 가 봤어? 대단해!"); return; }
  const t = pool[Math.floor(Math.random() * pool.length)];
  toast(`오늘은 ${disp(t)} 어때?`);
  openStation(t.i, true);
};

/* ───────── 설정 / D-day ───────── */
function renderDday() {
  const el = $("#dday");
  const names = [SETTINGS.a, SETTINGS.b].filter(Boolean).join(" & ");
  const d = SETTINGS.day ? dday(today()) : "";
  el.textContent = d ? `${names ? names + " · " : ""}${d}` : (names || "눌러서 우리 정보 넣기");
}
$("#brand").onclick = () => {
  $("#setA").value = SETTINGS.a || ""; $("#setB").value = SETTINGS.b || ""; $("#setDay").value = SETTINGS.day || "";
  openSheet($("#setSheet"));
};
$("#setSave").onclick = async () => {
  SETTINGS = { a: $("#setA").value.trim(), b: $("#setB").value.trim(), day: $("#setDay").value };
  await DB.put("meta", { k: "settings", v: SETTINGS });
  renderDday(); closeSheet($("#setSheet")); toast("저장했어");
};

/* 백업 */
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function dataURLToBlob(u) {
  const [head, b64] = u.split(","); const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
$("#bkOut").onclick = async () => {
  const busy = $("#bkBusy"); busy.classList.remove("hidden"); busy.textContent = "백업 파일 만드는 중…";
  try {
    const photos = await DB.all("photos");
    const parts = [`{"app":"ourmap","version":1,"exported":${JSON.stringify(new Date().toISOString())},"settings":${JSON.stringify(SETTINGS)},"wish":${JSON.stringify([...WISH])},"records":${JSON.stringify(RECS)},"photos":[`];
    for (let k = 0; k < photos.length; k++) {
      const p = photos[k];
      parts.push((k ? "," : "") + JSON.stringify({ id: p.id, full: await blobToDataURL(p.full), thumb: p.thumb ? await blobToDataURL(p.thumb) : null }));
      busy.textContent = `백업 만드는 중… 사진 ${k + 1}/${photos.length}`;
    }
    parts.push("]}");
    const name = `우리의노선도_백업_${today()}.json`;
    if (window.OurMapAndroid) {
      busy.textContent = "저장할 곳을 골라줘";
      OurMapAndroid.beginFile(name, "application/json");
      const all = parts.join(""); const CH = 256 * 1024;
      for (let i = 0; i < all.length; i += CH) OurMapAndroid.appendText(all.slice(i, i + CH));
      OurMapAndroid.finishFile();
    } else {
      const u = URL.createObjectURL(new Blob(parts, { type: "application/json" }));
      const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
      busy.textContent = `백업 파일을 내려받았어 (추억 ${RECS.length}개, 사진 ${photos.length}장). 미리보기 화면에서는 저장이 막힐 수 있어서, 백업은 앱에서 해줘.`;
    }
  } catch (e) { busy.textContent = "백업 실패: " + e.message; }
};
window.__onSaved = ok => { const b = $("#bkBusy"); b.classList.remove("hidden"); b.textContent = ok ? "백업 파일 저장 완료!" : "저장을 취소했어"; };
$("#bkIn").onclick = () => $("#bkFile").click();
$("#bkFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const busy = $("#bkBusy"); busy.classList.remove("hidden"); busy.textContent = "불러오는 중…";
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "ourmap") throw new Error("우리의 노선도 백업 파일이 아니야");
    let added = 0;
    for (let k = 0; k < (data.photos || []).length; k++) {
      const p = data.photos[k];
      if (await DB.get("photos", p.id)) continue;
      await DB.put("photos", { id: p.id, full: await dataURLToBlob(p.full), thumb: p.thumb ? await dataURLToBlob(p.thumb) : null });
      busy.textContent = `사진 불러오는 중… ${k + 1}/${data.photos.length}`;
    }
    const have = new Map(RECS.map(r => [r.id, r]));
    for (const r of data.records || []) {
      const cur = have.get(r.id);
      if (!cur) { RECS.push(r); added++; await DB.put("records", r); }
      else if ((r.updated || 0) > (cur.updated || 0)) { Object.assign(cur, r); await DB.put("records", cur); }
    }
    (data.wish || []).forEach(id => WISH.add(id)); await DB.put("meta", { k: "wish", v: [...WISH] });
    if (!SETTINGS.day && data.settings) { SETTINGS = data.settings; await DB.put("meta", { k: "settings", v: SETTINGS }); renderDday(); }
    reindex();
    busy.textContent = `불러오기 완료! 새 추억 ${added}개를 합쳤어`;
  } catch (err) { busy.textContent = "불러오기 실패: " + err.message; }
});

/* ───────── 토스트 ───────── */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2300); }

/* ───────── 시작 ───────── */
async function init() {
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { readColors(); draw(); });
  resize();
  addEventListener("resize", resize);
  buildChips();
  fitStations(ST, 0);
  try {
    RECS = (await DB.all("records")) || [];
    const w = await DB.get("meta", "wish"); if (w) WISH = new Set(w.v);
    const s = await DB.get("meta", "settings"); if (s) SETTINGS = s.v;
  } catch (e) { toast("저장소를 열 수 없어: " + e.message); }
  renderDday();
  reindex();
}
init();
</script>
